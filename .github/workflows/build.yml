name: Build Nova APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          FILE=$(find . -name settings.gradle.kts | head -1)
          cd "$(dirname "$FILE")"
          mkdir -p app/src/main/assets
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip || wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk-model-small-*.zip
          mv $(ls -d vosk-model-small-*/ | head -1) app/src/main/assets/model
          rm -f vosk-model-small-*.zip
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Nova.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-latest
          files: Nova.apk
